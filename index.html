<!doctype html>
<html lang="zh-CN" data-motion="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>STATUS · 角色面板（DEMO 示例数据）</title>
<style>
@charset "UTF-8";
/* ===== 角色面板 v2 · 只做红色（P5R 停格风），成长制：段位＋成长点；只排电脑宽度（1280–1920）；<html data-motion="on|off"> ===== */
:root{
  --red:#e60012; --ink:#0b0b0b; --paper:#fff; --hot:#ffe600;
  --grey:#8c8c8c;
  --f-disp:"Impact","Haettenschweiler","Arial Black","Futura-CondensedExtraBold","DIN Condensed","Helvetica Neue",sans-serif;
  --f-zh:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
  font-family:var(--f-zh);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
html{
  --bg:var(--red);
  --face-a:var(--ink); --on-a:#fff;        /* 黑块白字 */
  --face-b:#fff; --on-b:var(--ink);        /* 白块黑字 */
  --sh-on-dark:#fff; --sh-on-light:var(--ink); --sh-shape:var(--red);
  --hl:var(--hot);
  --cut-a:polygon(2.5% 0,100% 3%,97.5% 100%,0 95%);
  --cut-b:polygon(0 6%,97% 0,100% 93%,3% 100%);
  --cut-c:polygon(0 0,92% 0,100% 28%,100% 100%,7% 100%,0 74%);
  --cut-d:polygon(5% 0,100% 0,95% 100%,0 100%);
  --cut-t:polygon(.5% 0,100% .6%,99.5% 100%,0 99.4%);
  background:var(--red); color:var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; min-height:100vh; position:relative; overflow-x:hidden; overflow-x:clip; line-height:1.5; font-synthesis:none;}
h1,h2,h3,p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0; list-style:none}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; border-radius:0; text-align:inherit;}
:focus{outline:none}
:focus-visible{outline:3px solid #fff; outline-offset:3px; box-shadow:0 0 0 3px var(--ink);}

/* ===== 背景：①纯红 ②黑色锯齿碎片 ③半调网点 ④以雷达为心的放射线 ⑤零散星星 ===== */
.bg,.bg-top{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
.bg{background:var(--bg);}
.bg i,.bg-top i{position:absolute; display:block;}
.shard{background:var(--ink);}
.shard-a{left:-7vw; bottom:-9vh; width:60vw; height:64vh; clip-path:polygon(0 100%,0 34%,8% 44%,5% 19%,21% 38%,25% 7%,36% 41%,50% 25%,46% 55%,69% 49%,57% 67%,88% 73%,63% 84%,100% 100%);}
.shard-b{right:-7vw; top:-10vh; width:54vw; height:58vh; clip-path:polygon(100% 0,100% 67%,91% 55%,94% 81%,77% 60%,71% 91%,61% 57%,47% 72%,51% 42%,29% 47%,41% 30%,11% 22%,37% 14%,0 0);}
.shard-c{left:41vw; bottom:-3vh; width:13vw; height:20vh; background:none; filter:url(#boil0);}
.shard-c b{position:absolute; inset:0; background:var(--ink); clip-path:polygon(0 100%,28% 0,47% 57%,100% 26%,71% 100%);}
.dots{inset:-12%; background:radial-gradient(circle,rgba(11,11,11,.5) 1.6px,transparent 2px) 0 0/13px 13px;
  -webkit-mask-image:linear-gradient(122deg,#000 0%,rgba(0,0,0,.55) 26%,transparent 56%); mask-image:linear-gradient(122deg,#000 0%,rgba(0,0,0,.55) 26%,transparent 56%);}
.rays-wrap{position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
.rays{position:absolute; left:var(--rx,50%); top:var(--ry,480px); width:1500px; height:1500px; margin:-750px 0 0 -750px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(11,11,11,.15) 0deg 6deg,transparent 6deg 15deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 16%,rgba(0,0,0,.55) 52%,transparent 100%); mask-image:radial-gradient(closest-side,#000 16%,rgba(0,0,0,.55) 52%,transparent 100%);}
.star{left:var(--x); top:var(--y); width:var(--s); height:var(--s); background:var(--c); rotate:var(--r);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.frag{left:var(--x); top:var(--y); width:var(--s); height:calc(var(--s)*.7); rotate:var(--r); filter:url(#boil1);}
.frag b{position:absolute; inset:0; background:var(--c); clip-path:polygon(0 30%,100% 0,64% 100%);}
.fx-defs{position:absolute; width:0; height:0; overflow:hidden;}

/* ===== 版式（只排电脑宽度）：左＝标题、等级、勋章；中＝雷达（主角）；右＝骰子、委托、期限；两侧撑到雷达同高、卡片匀开 ===== */
.wrap{max-width:1600px; margin:0 auto; padding:14px 40px 36px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px 18px; min-height:62px; margin-bottom:4px;}
.grid{display:grid; gap:0 30px; align-items:stretch;
  grid-template-columns:minmax(0,.8fr) minmax(0,1.55fr) minmax(0,.8fr);
  grid-template-areas:"id radar dq";}
.blk-id,.blk-dq{container-type:inline-size; min-width:0; display:flex; flex-direction:column; justify-content:space-evenly; gap:26px; padding:8px 0 14px;}
.blk-id{grid-area:id;}
.blk-dq{grid-area:dq;}
.blk-radar{grid-area:radar; position:relative; min-width:0; display:flex; flex-direction:column; justify-content:center;}
.blk-radar > .sec-h{position:absolute; left:0; top:6px; z-index:2;}

/* ===== 贴纸块：本体（::after，剪纸形）＋错位影子（::before，会晃） ===== */
.stk{position:relative; isolation:isolate; --sx:8px; --sy:8px; --face:var(--face-a); --sh:var(--sh-on-dark); --cut:var(--cut-a); color:var(--on-a);}
.stk::before,.stk::after{content:""; position:absolute; inset:0; clip-path:var(--cut); pointer-events:none;}
.stk::before{z-index:-2; background:var(--sh); translate:var(--sx) var(--sy);}
.stk::after{z-index:-1; background:var(--face);}
.stk.light{--face:var(--face-b); --sh:var(--sh-on-light); color:var(--on-b);}

.sec-h{display:inline-flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; margin:0 0 16px; padding:5px 14px 6px 12px; background:var(--face-a); color:var(--on-a);
  font-size:17px; font-weight:900; letter-spacing:.06em; white-space:nowrap; rotate:-3deg; box-shadow:5px 5px 0 var(--sh-on-dark);}

/* ===== 控件（右上贴纸按钮） ===== */
.controls{display:flex; align-items:center; gap:12px 16px; justify-content:flex-end; margin-left:auto;}
.ctl{position:relative; isolation:isolate; display:inline-flex; align-items:center; gap:7px; min-height:44px; padding:6px 15px 7px 13px; color:#fff; font-size:13px; font-weight:800; white-space:nowrap;}
.ctl::before,.ctl::after{content:""; position:absolute; inset:0; clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);}
.ctl::after{z-index:-1; background:var(--face-a);}
.ctl::before{z-index:-2; background:var(--sh-on-dark); translate:5px 5px;}
.ctl{rotate:-2deg;}
.ctl-k{font-size:11px; letter-spacing:.14em; opacity:.85;}
.ctl-o{padding:1px 7px 2px; letter-spacing:.04em;}
.ctl[aria-pressed="true"] .ctl-o[data-on="true"], .ctl[aria-pressed="false"] .ctl-o[data-on="false"]{background:#fff; color:var(--ink);}
.demo-sticker{position:relative; isolation:isolate; display:inline-flex; align-items:baseline; gap:10px; padding:5px 20px 7px 16px; color:var(--ink); font-size:18px; font-weight:900; letter-spacing:.06em; rotate:-4deg;}
.demo-sticker::before,.demo-sticker::after{content:""; position:absolute; inset:0; clip-path:polygon(3% 0,100% 6%,97% 100%,0 92%);}
.demo-sticker::after{z-index:-1; background:#fff;}
.demo-sticker::before{z-index:-2; background:var(--ink); translate:7px 6px;}
.demo-sticker b{font-family:var(--f-disp); font-weight:400; font-size:32px; line-height:1; letter-spacing:.04em;}

/* ===== 标题：勒索信拼贴字 ===== */
.ransom{position:relative; isolation:isolate; display:flex; flex-wrap:nowrap; align-items:center; gap:.05em; line-height:1;
  font-size:clamp(44px,5.2vw,88px); font-size:clamp(44px,17cqw,92px); padding:.1em 0 .16em .04em;}
.rl{position:relative; isolation:isolate; display:inline-block; padding:.05em .1em .03em; line-height:.95; font-weight:900;}
html .rl{color:var(--rf,#fff); font-family:var(--rff,var(--f-disp)); font-style:var(--rfs,normal); font-size:var(--rs,1em); rotate:var(--rr,0deg); translate:0 var(--ry,0);}
html .rl::before,html .rl::after{content:""; position:absolute; inset:0;}
html .rl::after{z-index:-1; background:var(--rb,var(--ink)); border:var(--rbd,0 solid transparent);}
html .rl::before{z-index:-2; background:var(--rsh,var(--ink)); translate:.075em .07em;}
.subtitle{display:inline-block; margin:6px 0 0 .35em; padding:3px 24px 6px 18px; font-size:clamp(22px,7.6cqw,32px); font-weight:900; letter-spacing:.14em; rotate:-4.5deg; --cut:var(--cut-d); --sx:7px; --sy:7px;}
.week-tag{display:block; width:max-content; max-width:100%; margin:16px 0 0 1.4em; padding:5px 16px 6px 14px; font-family:var(--f-disp); font-size:16px; letter-spacing:.06em; rotate:3.5deg; --cut:var(--cut-d); --sx:5px; --sy:5px;}

/* ===== Lv 徽章（黑色多角星爆＋沸腾边缘）与经验条 ===== */
.lv-row{display:flex; align-items:center; gap:14px;}
.lv{position:relative; isolation:isolate; flex:0 0 auto; width:clamp(100px,36cqw,168px); aspect-ratio:1; display:grid; place-items:center; color:#fff;}
.lv::before{content:""; position:absolute; inset:0; z-index:-3; background:#fff; translate:7px 7px; clip-path:var(--lv-star);}
.lv{--lv-star:polygon(49.3% 2.9%,56.3% 17.5%,66.3% 3%,66.3% 19.4%,81.8% 13.9%,79.1% 25.8%,91.1% 24.1%,84.5% 37.3%,96.6% 40.1%,87.5% 51.4%,97.3% 58.5%,83.5% 60.7%,92.6% 74.1%,76.6% 71.3%,82.8% 87.3%,66.4% 80.8%,64.6% 95.5%,56.9% 84.6%,49.9% 96.8%,44.5% 83.3%,33.1% 96.6%,32.1% 82.4%,21.4% 86.9%,24.6% 72.7%,8.7% 71.9%,18.2% 61.7%,1.9% 56.6%,14.7% 49.6%,1.8% 43.2%,14.7% 37.2%,7.3% 26.6%,23.2% 27.8%,18.6% 13.9%,32.4% 20.4%,32.4% 6.3%,43.7% 14.6%);}
.lv .bz{position:absolute; inset:0; z-index:-2;}
.lv .bz b{position:absolute; inset:0; background:var(--ink); clip-path:var(--lv-star);}
.lv .bz.b0{filter:url(#boil0)} .lv .bz.b1{filter:url(#boil1); opacity:0} .lv .bz.b2{filter:url(#boil2); opacity:0}
.lv-k{position:absolute; left:23%; top:25%; font-family:var(--f-disp); font-size:clamp(15px,5cqw,21px); letter-spacing:.04em; rotate:-12deg; line-height:1;}
.lv-n{font-family:var(--f-disp); font-size:clamp(50px,17cqw,76px); line-height:1; text-shadow:5px 5px 0 var(--red); translate:6% 8%;}
.exp{flex:1 1 0; min-width:0; padding:11px 16px 13px 18px; --cut:var(--cut-b); --sx:7px; --sy:7px; --jd:-.25s; rotate:-3deg;}
.exp-top{display:flex; justify-content:space-between; align-items:baseline; gap:2px 10px; flex-wrap:wrap;}
.exp-k{font-family:var(--f-disp); font-size:24px; letter-spacing:.05em; line-height:1.1;}
.exp-v{font-size:13px; font-weight:800; white-space:normal;}
.exp-v b{font-family:var(--f-disp); font-weight:400; font-size:17px; letter-spacing:.02em;}
.exp-v .gain{color:var(--hl);}
.exp-v .xc{white-space:nowrap;}
.exp-bar{display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:4px; height:20px; margin:10px 4px 8px 6px;}
.seg{position:relative; overflow:hidden; transform:skewX(-22deg); border:2px solid #fff;}
.seg i{position:absolute; top:0; bottom:0; display:block;}
.seg .o{left:0; width:calc(var(--o,0)*100%); background:#fff;}
.seg .n{left:calc(var(--o,0)*100%); width:calc(var(--n,0)*100%); background:var(--hl);}
.exp-note{font-size:12px; font-weight:700; opacity:.92;}
.exp-note span{display:inline-block;}

/* ===== 雷达（视觉中心） ===== */
.radar{position:relative; width:100%; aspect-ratio:1/1; container-type:inline-size;}
.radar svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block;}
.burst-sh{fill:#fff;}
.burst{fill:var(--ink);}
.boil.b1,.boil.b2{opacity:0}
.ring{fill:none; stroke:#fff; stroke-opacity:.38; stroke-width:1.3; vector-effect:non-scaling-stroke;}
.ring.r10{stroke-opacity:.72; stroke-width:2;}
.axis{stroke:#fff; stroke-opacity:.38; stroke-width:1.3; vector-effect:non-scaling-stroke;}
.axis.dim{stroke-dasharray:7 7; stroke-opacity:.85; stroke-width:2;}
.ring-in{fill:none; stroke:var(--ink); stroke-opacity:.2; stroke-width:1.2; vector-effect:non-scaling-stroke;}
.shape-fill{fill:#fff;}
.shape-line{fill:none; stroke:var(--ink); stroke-width:4; stroke-linejoin:miter; stroke-miterlimit:6;}
.shape-sh{fill:var(--sh-shape);}
.tick{font-family:var(--f-disp); font-size:15px; fill:#fff; stroke:var(--ink); stroke-width:4px; paint-order:stroke; stroke-linejoin:round; letter-spacing:.04em;}
.vx{cursor:default;}
.vx .hit{fill:transparent;}
.vx .star{transform-box:fill-box; transform-origin:center; transition:scale .16s cubic-bezier(.2,.9,.3,1.6);}
.vx .star{fill:#fff; stroke:var(--ink); stroke-width:3; stroke-linejoin:round;}
.vx.dim .star{fill:#a3a3a3;}
.vx.is-hot .star{fill:var(--red); scale:1.65;}

/* 名签：黑底白字斜条＋白底段位块＋称号与音符条＋小标一行（每枚小标不折行，最多两行）；焦点另贴一枚黄标 */
.plates{position:absolute; inset:0; pointer-events:none;}
.plate{position:absolute; left:calc(var(--px) + var(--ox,0px)); top:calc(var(--py) + var(--oy,0px)); translate:var(--tx) var(--ty); rotate:var(--tilt,0deg);
  pointer-events:auto; display:grid; grid-template-columns:auto auto; grid-template-areas:"n g" "s s" "m m"; justify-content:start; align-items:stretch;
  font-size:clamp(14px,2.9cqw,22px); color:#fff; z-index:1; transition:scale .18s cubic-bezier(.2,.9,.3,1.6);}
.pl-n{grid-area:n; position:relative; isolation:isolate; display:flex; flex-direction:column; justify-content:center; padding:.2em .55em .24em .5em;}
.pl-n::before,.pl-n::after,.pl-g::before,.pl-g::after{content:""; position:absolute; inset:0; pointer-events:none;}
.pl-n::after{z-index:-1; background:var(--ink); clip-path:polygon(7% 0,100% 0,100% 100%,0 100%);}
.pl-n::before{z-index:-2; background:#fff; clip-path:polygon(7% 0,100% 0,100% 100%,0 100%); translate:.26em .26em;}
.pl-name{font-size:1em; font-weight:900; letter-spacing:.08em; line-height:1.15; white-space:nowrap;}
.pl-en{font-family:var(--f-disp); font-size:max(10.5px,.52em); letter-spacing:.12em; line-height:1.15; opacity:.88;}
.pl-g{grid-area:g; position:relative; isolation:isolate; display:grid; place-items:center; min-width:1.15em; padding:.04em .16em 0; font-family:var(--f-disp); font-size:2.05em; line-height:1; color:var(--ink);}
.pl-g::after{z-index:-1; background:#fff; clip-path:polygon(0 0,100% 7%,91% 100%,0 100%);}
.pl-g::before{z-index:-2; background:var(--ink); clip-path:polygon(0 0,100% 7%,91% 100%,0 100%); translate:.11em .11em;}
.pl-s{grid-area:s; justify-self:start; display:flex; flex-wrap:wrap; align-items:center; gap:.12em .45em; margin:.28em 0 0 .3em; padding:.14em .55em .16em; font-size:max(13px,.72em); font-weight:900; line-height:1.3; white-space:nowrap; background:var(--ink); color:#fff;}
.pl-t{white-space:nowrap;}
.notes{white-space:nowrap; color:var(--hot); letter-spacing:.04em;}
.notes i{font-style:normal; opacity:.3;} .notes i.on{opacity:1;}
.notes.off{padding:0 .4em; background:var(--grey); color:#fff;}
.pl-mo{display:inline-block; padding:0 .35em; background:var(--red); color:#fff; letter-spacing:.06em; white-space:nowrap; rotate:-6deg; box-shadow:.12em .12em 0 #fff;}
.pl-m{grid-area:m; justify-self:start; display:flex; flex-wrap:wrap; gap:.22em .3em; width:0; min-width:calc(100% - .9em); margin:.24em 0 0 .9em; font-size:max(12.5px,.62em); font-weight:900; line-height:1.35;}
.pl-c{padding:.05em .45em .08em; background:#fff; color:var(--ink); white-space:nowrap;}
.pl-c.hot{background:var(--hot);}
.pl-f{position:absolute; right:-.75em; top:-.9em; padding:.04em .42em .06em; background:var(--hot); color:var(--ink); font-size:max(12.5px,.6em); font-weight:900; letter-spacing:.04em; line-height:1.3; white-space:nowrap; rotate:10deg; box-shadow:.14em .14em 0 var(--ink);}
.plate.one .pl-m{width:auto; min-width:0; flex-wrap:nowrap;}   /* 顶上那张横向不缺地方、纵向紧：小标排成一行 */
.plate.tight{width:min-content;}
.plate.tight .pl-s{white-space:normal;}
.plate.dim .pl-n::after,.plate.dim .pl-s{background:#5e5e5e;}
.plate.dim .pl-g{color:#5e5e5e;} .plate.dim .pl-g::after,.plate.dim .pl-c{background:#d4d4d4;}
.plate.dim .notes{color:#fff;}
.plate.focus .pl-g::after,.plate.flash .pl-g::after{background:var(--hot);}
.plate.is-hot{scale:1.09; z-index:3;}
.plate.is-hot .pl-n::before{translate:.5em .45em;}
.plate.is-hot .pl-g::before{translate:.22em .2em;}
.plate:focus-visible{outline-offset:5px;}

/* ===== 骰子与支线 ===== */
.dice{display:flex; align-items:center; gap:14px; padding:9px 22px 9px 14px; rotate:-2.5deg; --cut:var(--cut-d); --jd:-.125s;}
.d20{width:60px; height:60px; flex:0 0 auto; overflow:visible;}
.d20 .f{fill:#fff; stroke:var(--ink); stroke-width:4; stroke-linejoin:round;}
.d20 .l{fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linejoin:round;}
.d20 text{font-family:var(--f-disp); font-size:25px; fill:var(--ink);}
.quest.done .stamp{border-color:var(--ink); color:var(--ink); box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--ink);}
.dice-t{font-size:15px; font-weight:800; line-height:1.35;}
.dice-t b{font-family:var(--f-disp); font-weight:400; font-size:24px; letter-spacing:.03em; margin-right:4px; white-space:nowrap;}
.dice-t .hot-tag{background:var(--hot); color:var(--ink); padding:0 6px; white-space:nowrap;}
.quest{position:relative; isolation:isolate; margin:4px 12px 6px 6px; padding:24px 22px 20px 24px; color:var(--ink); rotate:-3deg;}
.quest::before,.quest::after{content:""; position:absolute; inset:0; clip-path:polygon(0 3%,100% 0,98.5% 100%,1% 97%); pointer-events:none;}
.quest::after{z-index:-1; background:#fff;}
.quest::before{z-index:-2; background:var(--ink); translate:8px 8px;}
.tape{position:absolute; left:-18px; top:-4px; width:96px; height:26px; background:var(--ink); rotate:-33deg; clip-path:polygon(4% 12%,97% 0,100% 86%,0 100%);}
.stamp{position:absolute; right:14px; top:12px; padding:2px 10px 3px; border:3px solid var(--red); color:var(--red); background:#fff; font-family:var(--f-disp); font-size:19px; letter-spacing:.07em; line-height:1.15; rotate:8deg; box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--red);}
.quest-k{font-size:13px; font-weight:900; letter-spacing:.24em; padding-right:118px;}
.quest-t{font-size:16px; font-weight:700; line-height:1.7; margin-top:10px;}

/* ===== 勋章（盖章样，只展示）与期限倒计时 ===== */
.medals{display:flex; flex-wrap:wrap; gap:14px 18px;}
.medal{display:grid; place-items:center; align-content:center; width:92px; height:92px; border:4px solid var(--red); border-radius:50%; background:#fff; color:var(--red); text-align:center; rotate:calc(-8deg + var(--i,0)*11deg); box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--red),6px 6px 0 var(--ink);}
.medal b{font-size:17px; font-weight:900; letter-spacing:.06em; line-height:1.1;}
.medal small{font-family:var(--f-disp); font-size:15px; letter-spacing:.06em; color:var(--ink);}
.dl-box{padding:14px 20px 16px 18px; rotate:1.5deg; --cut:var(--cut-a); --jd:-.375s;}
.dl-k{margin-bottom:8px; font-size:13px; font-weight:900; letter-spacing:.24em;}
.dl-list{display:grid; gap:12px;}
.dl-h{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:2px 12px; font-size:14px; font-weight:800;}
.dl-d{font-size:14px; font-weight:900; white-space:nowrap;}
.dl.near .dl-d{padding:0 6px; background:var(--red); color:#fff;}
.dl-bar{position:relative; display:block; height:12px; margin:4px 6px 0; border:2px solid var(--ink); transform:skewX(-20deg); overflow:hidden;}
.dl-bar i{position:absolute; left:0; top:0; bottom:0; width:calc(var(--w,0)*100%); background:var(--ink);}
.dl.near .dl-bar i{background:var(--red);}
.dl-t{display:block; margin-top:2px; font-family:var(--f-disp); font-size:13px; opacity:.75;}

/* ===== 提示层（瘦身）：这一维的五级称号阶梯（没到的是「？」）＋一句「距下一段还差 N 点」 ===== */
.tip{position:fixed; left:0; top:0; z-index:40; width:max-content; max-width:min(330px,calc(100vw - 20px)); padding:12px 18px 13px 14px; color:#fff; pointer-events:none; isolation:isolate; font-size:14px; line-height:1.45; translate:var(--tipx,0) var(--tipy,0);}
.tip::before,.tip::after{content:""; position:absolute; inset:0; clip-path:polygon(0 0,100% 3%,98% 100%,1.5% 97%);}
.tip::after{z-index:-1; background:var(--ink);}
.tip::before{z-index:-2; background:#fff; translate:7px 7px;}
.tip-lad{display:grid; gap:5px;}
.tip-lad li{justify-self:start; display:flex; align-items:baseline; gap:8px; margin-left:calc(var(--k,0)*.9em); padding:1px 12px 2px 8px; border:2px solid #fff; background:#fff; color:var(--ink); font-weight:900; white-space:nowrap; transform:skewX(-12deg);}
.tip-lad b{font-family:var(--f-disp); font-weight:400; font-size:17px; line-height:1;}
.tip-lad li.now{border-color:var(--red); background:var(--red); color:#fff; box-shadow:4px 4px 0 #fff;}
.tip-lad li.todo{border-style:dashed; border-color:#777; background:none; color:#9a9a9a;}
.tip-f{margin-top:10px; font-weight:900; white-space:nowrap;}
.tip-f b{font-family:var(--f-disp); font-weight:400; font-size:21px; line-height:1; color:var(--hot);}

/* ===== 升段演出：一条斜切黑带横扫过屏（关动态时不播） ===== */
.show{position:fixed; inset:0; z-index:60; display:grid; align-items:center; overflow:hidden; pointer-events:none; visibility:hidden;}
.show-band{margin:0 -14vw; padding:22px 16vw 26px; rotate:-7deg; background:var(--ink); color:#fff; text-align:center; border-top:10px solid #fff; border-bottom:10px solid #fff; box-shadow:0 16px 0 var(--red); transform:translateX(-130vw);}
.show-k{font-family:var(--f-disp); font-size:clamp(52px,11vw,150px); line-height:1; letter-spacing:.04em; text-shadow:6px 6px 0 var(--red);}
.show-s{margin-top:8px; font-size:clamp(16px,2.6vw,28px); font-weight:900; letter-spacing:.08em;}
#panel-errors{white-space:pre-wrap;}


/* ===== 动效：motion=on。一律停格（steps／每秒 8 帧） ===== */
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(-3px,3px)}75%{transform:translate(3px,2px)}}
@keyframes jit2{0%{transform:translate(0,0)}25%{transform:translate(-3px,3px)}50%{transform:translate(4px,1px)}75%{transform:translate(-1px,-3px)}}
@keyframes jit-svg{0%{transform:translate(0,0)}25%{transform:translate(7px,-5px)}50%{transform:translate(-5px,6px)}75%{transform:translate(5px,3px)}}
@keyframes boil{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
@keyframes boilf{0%{filter:url(#boil0)}33.3%{filter:url(#boil1)}66.6%{filter:url(#boil2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dots{to{transform:translate(26px,13px)}}
@keyframes twitch{0%{transform:none}25%{transform:translate(1px,-2px) rotate(4deg)}50%{transform:translate(-2px,1px) rotate(-3deg)}75%{transform:translate(1px,1px) scale(1.06)}}
html[data-motion="on"] .stk::before,
html[data-motion="on"] .rl::before,
html[data-motion="on"] .quest::before,
html[data-motion="on"] .lv::before{animation:jit .5s steps(1,end) infinite; animation-delay:var(--jd,0s); will-change:transform;}
html[data-motion="on"] .pl-n::before,
html[data-motion="on"] .pl-g::before,
html[data-motion="on"] .ctl::before,
html[data-motion="on"] .demo-sticker::before{animation:jit2 .5s steps(1,end) infinite; animation-delay:var(--jd,0s);}
html[data-motion="on"] .shape-sh{animation:jit-svg .5s steps(1,end) infinite;}
html[data-motion="on"] .burst-sh{animation:jit-svg .5s steps(1,end) infinite; animation-delay:-.25s;}
html[data-motion="on"] .boil,html[data-motion="on"] .lv .bz{animation:boil .375s steps(1,end) infinite;}
html[data-motion="on"] .boil.b1,html[data-motion="on"] .lv .bz.b1{animation-delay:-.125s;}
html[data-motion="on"] .boil.b2,html[data-motion="on"] .lv .bz.b2{animation-delay:-.25s;}
html[data-motion="on"] .rays{animation:spin 90s steps(720) infinite; will-change:transform;}
html[data-motion="on"] .dots{animation:dots 6s steps(48) infinite;}
html[data-motion="on"] .star{animation:twitch .5s steps(1,end) infinite; animation-delay:var(--jd,0s);}
html[data-motion="on"] .frag,html[data-motion="on"] .shard-c{animation:boilf .375s steps(1,end) infinite; animation-delay:var(--jd,0s);}
html[data-motion="on"] .frag b{animation:twitch .5s steps(1,end) infinite; animation-delay:var(--jd,0s);}

/* 入场（1.4 秒内一次）：碎片砸入→标题字块落位→网格画出→数据多边形弹出→名签依次弹出→分数跳字 */
@keyframes slam-a{0%{transform:translate(-34vw,26vh) rotate(-10deg) scale(1.25)}70%{transform:translate(1vw,-1vh) rotate(1deg) scale(.98)}}
@keyframes slam-b{0%{transform:translate(32vw,-26vh) rotate(9deg) scale(1.25)}70%{transform:translate(-1vw,1vh) rotate(-1deg) scale(.98)}}
@keyframes drop{0%{transform:scale(2.7) rotate(30deg); opacity:0}50%{transform:scale(.88) rotate(-7deg); opacity:1}78%{transform:scale(1.07) rotate(2deg)}}
@keyframes grow{0%{transform:scale(0); opacity:0}70%{transform:scale(1.04); opacity:1}}
@keyframes pop-shape{0%{transform:scale(0)}65%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg); opacity:0}65%{transform:scale(1.14) rotate(3deg); opacity:1}100%{transform:none}}
@keyframes slide-in{0%{transform:translateX(46px) skewX(-12deg); opacity:0}70%{transform:translateX(-4px) skewX(2deg); opacity:1}100%{transform:none}}
@keyframes fade-up{0%{transform:translateY(18px); opacity:0}100%{transform:none}}
html.intro[data-motion="on"] .shard-a{animation:slam-a .4s cubic-bezier(.2,.8,.3,1) backwards;}
html.intro[data-motion="on"] .shard-b{animation:slam-b .4s .06s cubic-bezier(.2,.8,.3,1) backwards;}
html.intro[data-motion="on"] .rl{animation:drop .42s cubic-bezier(.2,.9,.3,1.3) backwards; animation-delay:calc(.16s + var(--i,0)*.07s);}
html.intro[data-motion="on"] .subtitle,html.intro[data-motion="on"] .week-tag{animation:slide-in .34s .55s cubic-bezier(.2,.8,.3,1) backwards;}
html.intro[data-motion="on"] .lv{animation:pop .4s .5s cubic-bezier(.2,.9,.3,1) backwards;}
html.intro[data-motion="on"] .exp{animation:slide-in .34s .62s cubic-bezier(.2,.8,.3,1) backwards;}
html.intro[data-motion="on"] .rd-rings .ring,html.intro[data-motion="on"] .rd-axes .axis{animation:grow .3s cubic-bezier(.2,.8,.3,1) backwards; animation-delay:calc(.4s + var(--i,0)*.05s);}
html.intro[data-motion="on"] .rd-shape{animation:pop-shape .34s .72s cubic-bezier(.2,.8,.3,1) backwards;}
html.intro[data-motion="on"] .vx .star{animation:pop .22s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:calc(.96s + var(--i,0)*.04s);}
html.intro[data-motion="on"] .plate{animation:pop .3s cubic-bezier(.2,.9,.3,1) backwards; animation-delay:calc(.9s + var(--i,0)*.06s);}
html.intro[data-motion="on"] .dice,html.intro[data-motion="on"] .quest,html.intro[data-motion="on"] .dl-box,html.intro[data-motion="on"] .medal{animation:fade-up .34s .86s cubic-bezier(.2,.8,.3,1) backwards;}
html.intro[data-motion="on"] .stamp{animation:drop .42s 1.15s cubic-bezier(.2,.9,.3,1.3) backwards;}
html[data-motion="on"] .plate.flash{animation:pop .32s cubic-bezier(.2,.9,.3,1) 3;}
html[data-motion="on"] .pl-f{animation:twitch .5s steps(1,end) infinite; animation-delay:var(--jd,0s);}
html.page-hidden *,html.page-hidden *::before,html.page-hidden *::after{animation-play-state:paused!important;}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{animation:none!important; transition:none!important;}
@media (prefers-reduced-motion:reduce){
  html:not([data-motion-explicit]) *,html:not([data-motion-explicit]) *::before,html:not([data-motion-explicit]) *::after{animation:none!important; transition:none!important;}
}
@media (hover:hover) and (pointer:fine){
  .ctl:hover::before{translate:8px 8px;}
  .plate:hover{scale:1.09; z-index:3;}
  .plate:hover .pl-n::before{translate:.5em .45em;}
  .plate:hover .pl-g::before{translate:.22em .2em;}
  html[data-motion="on"] .dice:hover .d20{animation:twitch .5s steps(1,end) infinite;}
}

/* ===== 强制色兜底 ===== */
@media (forced-colors:active){
  .bg,.bg-top,.rays-wrap,.show,.rd-burst{display:none!important;}
  .stk::before,.stk::after,.rl::before,.rl::after,.quest::before,.quest::after,.pl-n::before,.pl-n::after,.pl-g::before,.pl-g::after,.ctl::before,.ctl::after,.tip::before,.tip::after,.lv::before,.lv .bz,.demo-sticker::before,.demo-sticker::after,.tape{display:none!important;}
  .stk,.rl,.quest,.pl-n,.pl-g,.pl-s,.pl-c,.pl-f,.pl-mo,.ctl,.tip,.tip-lad li,.lv,.demo-sticker,.sec-h,.medal{border:2px solid CanvasText; background:Canvas; color:CanvasText;}
  .tip-lad li.now{background:Highlight; color:HighlightText;}
  .ctl[aria-pressed] .ctl-o[data-on]{background:Canvas; color:CanvasText;}
  .ctl[aria-pressed="true"] .ctl-o[data-on="true"],.ctl[aria-pressed="false"] .ctl-o[data-on="false"]{background:Highlight; color:HighlightText;}
  .ring,.axis,.ring-in{stroke:GrayText;}
  .shape-fill{fill:Highlight; fill-opacity:.3;} .shape-line{stroke:CanvasText;} .shape-sh{display:none;}
  .vx .star{fill:Canvas; stroke:CanvasText;} .vx.is-hot .star{fill:Highlight;}
  .tick{fill:CanvasText; stroke:Canvas;}
  .seg .o,.seg .n,.dl-bar i{background:CanvasText;} .seg,.dl-bar{border-color:CanvasText;}
  .plate.is-hot{outline:3px solid Highlight;}
}

function ptsStr(a){ return a.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }

/* ---------- 状态：网址参数 > 本地记忆 > 默认（系统减少动态时默认关）；记忆按键读写，别的键原样留着 ---------- */
var KEY='statusPanel.v2';
var state={motion:reduce.matches?'off':'on'};
var explicitMotion=false, FOCUS='';
function readStore(){ try{ var o=JSON.parse(window.localStorage.getItem(KEY)||'null'); return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; }catch(_){ return {}; } }
var saved=readStore();
if(saved.motion==='on'||saved.motion==='off'){ state.motion=saved.motion; explicitMotion=true; }
try{
  var qs=new URLSearchParams(window.location.search);
  if(/^(on|off)$/.test(qs.get('motion')||'')){ state.motion=qs.get('motion'); explicitMotion=true; }
  if(/^[a-z]{2,12}$/.test(qs.get('focus')||'')) FOCUS=qs.get('focus');
}catch(_){ }
function save(k,v){ var o=readStore(); o[k]=v; try{ window.localStorage.setItem(KEY,JSON.stringify(o)); }catch(_){ } }
function applyRoot(){
  root.setAttribute('data-motion',state.motion);
  if(explicitMotion) root.setAttribute('data-motion-explicit','1'); else root.removeAttribute('data-motion-explicit');
  $('#ctl-motion').setAttribute('aria-pressed',String(state.motion==='on'));
}

/* ---------- 小件：称号、段位区间、音符（按月结的维换成「月结」小标）、下一段 ---------- */
function titleOf(d,k){ var t=TITLES[d.id]; return (t&&t[k-1])?t[k-1]:k+' 段'; }
function has(o,k){ return o!=null&&Object.prototype.hasOwnProperty.call(o,k)&&o[k]!=null; }
function band(d){   /* 当前段的起止门槛：lo＝本段起点，hi＝下一段起点（五段为 null） */
  if(!TH||!(d.rank>=1&&d.rank<=5)) return null;
  return {lo:d.rank===1?0:TH[d.rank-2],hi:d.rank===5?null:TH[d.rank-1]};
}
function noteEl(d){
  if(d.scored===false) return el('span','notes off','不计分');
  if(d.monthly_only===true) return el('span','pl-mo','月结');
  if(!has(d,'notes')) return null;
  var s=el('span','notes');
  for(var i=0;i<3;i++) s.appendChild(el('i',i<d.notes?'on':null,'♪'));
  return s;
}
function nextText(d){
  if(d.waiting_gate) return '等里程碑';
  if(d.rank===5) return '满段';
  return has(d,'to_next')?'差 '+d.to_next+' 点':'';
}

/* ---------- 雷达 ---------- */
function burstPts(n,rOut,rIn,seed){
  var rnd=mulberry(seed), pts=[];
  for(var i=0;i<n*2;i++){
    var a=-Math.PI/2+i*Math.PI/n+(rnd()-0.5)*0.15, r=(i%2===0)?rOut-rnd()*26:rIn+rnd()*16;
    pts.push([r*Math.cos(a),r*Math.sin(a)]);
  }
  return ptsStr(pts);
}
function renderRadarStatic(){
  var b=burstPts(23,292,238,0x7F3A);
  ['burst0','burst1','burst2','burst-sh'].forEach(function(id){ document.getElementById(id).setAttribute('points',b); });
}
function ang(i,n){ return -Math.PI/2+i*2*Math.PI/n; }
function polar(r,a){ return [r*Math.cos(a),r*Math.sin(a)]; }
function dimById(id){ for(var i=0;i<DIMS.length;i++){ if(DIMS[i].id===id) return DIMS[i]; } return null; }
function ringR(k){ return R*k/5; }   /* 第 k 环＝第 k 段的起点：一环 R/5（开局的小五边形），五环 R */
function radiusOf(d){   /* 段内位置按门槛插值；只有段位、或数据没带门槛时画在该段起点；五段画在最外环 */
  var k=clamp(Math.round(d.rank)||1,1,5), bd=band(d);
  if(k===5||!bd||!has(d,'points')) return ringR(k);
  return ringR(k)+clamp((d.points-bd.lo)/(bd.hi-bd.lo),0,0.96)*(ringR(k+1)-ringR(k));   /* 没升段就不压到下一环上 */
}
function shapeOf(){ var n=DIMS.length; return DIMS.map(function(d,i){ return polar(radiusOf(d),ang(i,n)); }); }
function setShape(pts){ var s=ptsStr(pts); ['shape-fill','shape-line','shape-sh','clip-poly'].forEach(function(id){ document.getElementById(id).setAttribute('points',s); }); }
function starPts(ro,ri){ var p=[]; for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, r=(i%2)?ri:ro; p.push([r*Math.cos(a),r*Math.sin(a)]); } return ptsStr(p); }
var STAR=starPts(15,6.3);

  for(var k=1;k<=5;k++){

    var p=sv('polygon',{points:ptsStr(pts),'class':'ring'+(k===5?' r10':'')}); p.style.setProperty('--i',String(k-1)); rings.appendChild(p);
    if(k<5) rin.appendChild(sv('polygon',{points:ptsStr(pts),'class':'ring-in'}));
  }
  var axes=$('#rd-axes'); axes.textContent='';
  DIMS.forEach(function(d,i){
    var e=polar(R,ang(i,n));
    var l=sv('line',{x1:0,y1:0,x2:f1(e[0]),y2:f1(e[1]),'class':'axis'+(d.dimmed?' dim':'')}); l.style.setProperty('--i',String(i)); axes.appendChild(l);
    rin.appendChild(sv('line',{x1:0,y1:0,x2:f1(e[0]),y2:f1(e[1]),'class':'ring-in'}));
  });
  var ticks=$('#rd-ticks'); ticks.textContent='';
  var ta=-Math.PI/2+Math.PI/n, tc=Math.cos(Math.PI/n);
  for(var j=1;j<=5;j++){ var q=polar(ringR(j)*tc,ta), t=sv('text',{x:f1(q[0]+5),y:f1(q[1]-4),'class':'tick'}); t.textContent=String(j); ticks.appendChild(t); }
  setShape(shapeOf());
  renderVertices(); renderPlates();
  SVG.setAttribute('aria-label','五维段位雷达：'+DIMS.map(function(d){ return d.name+' '+d.rank+' 段「'+titleOf(d,d.rank)+'」'+(has(d,'points')?'（'+d.points+' 点）':''); }).join('；'));
  requestAnimationFrame(function(){ clampPlates(); placeRays(); });
}

function fitPlate(b,W,H,m){
  var st=b.style; st.removeProperty('--ox'); st.removeProperty('--oy');
  var w=b.offsetWidth, h=b.offsetHeight;
  var L=parseFloat(st.getPropertyValue('--px'))/100*W+parseFloat(st.getPropertyValue('--tx'))/100*w;
  var T=parseFloat(st.getPropertyValue('--py'))/100*H+parseFloat(st.getPropertyValue('--ty'))/100*h;
  var ox=0, oy=0;
  if(L<m) ox=m-L; else if(L+w>W-m) ox=W-m-(L+w);
  if(T<m) oy=m-T; else if(T+h>H-m) oy=H-m-(T+h);
  if(ox) st.setProperty('--ox',ox.toFixed(1)+'px');
  if(oy) st.setProperty('--oy',oy.toFixed(1)+'px');
  return {l:L+ox-3,t:T+oy-3,r:L+ox+w+3,b:T+oy+h+3};
}
function rectHitsPoly(r,poly){   /* 分离轴：轴对齐矩形 vs 凸多边形 */
  var xs=poly.map(function(p){ return p[0]; }), ys=poly.map(function(p){ return p[1]; });
  if(r.r<Math.min.apply(null,xs)||r.l>Math.max.apply(null,xs)||r.b<Math.min.apply(null,ys)||r.t>Math.max.apply(null,ys)) return false;
  var corners=[[r.l,r.t],[r.r,r.t],[r.l,r.b],[r.r,r.b]];
  for(var i=0;i<poly.length;i++){
    var a=poly[i], c=poly[(i+1)%poly.length], nx=c[1]-a[1], ny=a[0]-c[0];
    var pd=poly.map(function(p){ return p[0]*nx+p[1]*ny; }), rd=corners.map(function(p){ return p[0]*nx+p[1]*ny; });
    if(Math.max.apply(null,rd)<Math.min.apply(null,pd)||Math.min.apply(null,rd)>Math.max.apply(null,pd)) return false;
  }
  return true;
}
function clampPlates(){
  var box=$('#radar'), W=box.clientWidth, H=box.clientHeight, m=6, k=W/(2*VB), n=DIMS.length, ring=[];
  for(var i=0;i<n;i++){ var q=polar(R*k,ang(i,n)); ring.push([W/2+q[0],H/2+q[1]]); }
  var plates=$$('.plate',box), hit=[];
  plates.forEach(function(b){ b.classList.remove('tight'); hit.push(rectHitsPoly(fitPlate(b,W,H,m),ring)); });
  plates.forEach(function(b,i){ if(hit[i]||hit[(n-i)%n]){ b.classList.add('tight'); fitPlate(b,W,H,m); } });   /* 左右镜像一起折，保持对称 */
}
/* ---------- 联动高亮与提示层（值在前、名在后；文字一律墨色） ---------- */
var tip=$('#tip'), tipAnchor=null, tipMode='side', hotId=null, pinned=false;
function setHot(id){
  $$('.is-hot').forEach(function(nd){ nd.classList.remove('is-hot'); });
  hotId=id||null;
  if(hotId) $$('[data-dim="'+hotId+'"]').forEach(function(nd){ nd.classList.add('is-hot'); });
}
function syncExpanded(){ $$('.plate').forEach(function(b){ b.setAttribute('aria-expanded',String(pinned&&tipAnchor===b&&!tip.hidden)); }); }
function activate(id,anchor,pin,mode){
  var d=dimById(id); if(!d) return;
  pinned=!!pin; setHot(id); showTip(d,anchor,mode||'side'); syncExpanded();
}
function deactivate(){ pinned=false; setHot(null); hideTip(); syncExpanded(); }
function showTip(d,anchor,mode){   /* 只放五级称号阶梯（高的在上，没到的是「？」）和一句距下一段 */
  tip.textContent='';
  var ol=el('ol','tip-lad');
  for(var k=5;k>=1;k--){
    var li=el('li',k<d.rank?'got':(k===d.rank?'now':'todo')); li.style.setProperty('--k',String(k-1));
    li.append(el('b',null,k),txt(k<=d.rank?titleOf(d,k):'？')); ol.appendChild(li);
  }
  tip.appendChild(ol);
  if(d.waiting_gate) tip.appendChild(el('p','tip-f','距下一段只差里程碑'));
  else if(d.rank<5&&has(d,'to_next')){ var f=el('p','tip-f'); f.append(txt('距下一段还差 '),el('b',null,d.to_next),txt(' 点')); tip.appendChild(f); }
  if(tipAnchor&&tipAnchor!==anchor&&tipAnchor.removeAttribute) tipAnchor.removeAttribute('aria-describedby');
  tip.hidden=false; tipAnchor=anchor; tipMode=mode;
  if(anchor&&anchor.namespaceURI!==NS) anchor.setAttribute('aria-describedby','tip');
  positionTip();
}
function positionTip(){
  if(tip.hidden||!tipAnchor) return;
  if(!tipAnchor.isConnected){ hideTip(); return; }
  var r=tipAnchor.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  var vw=document.documentElement.clientWidth, vh=window.innerHeight, gap=14, x, y;
  if(tipMode==='below'){
    x=clamp(r.right-w-10,8,vw-w-8); y=r.bottom+8;
    if(y+h>vh-8) y=r.top-8-h;
  } else {
    x=r.right+gap; y=r.top+r.height/2-h/2;
    if(x+w>vw-8) x=r.left-gap-w;
    if(x<8){ x=clamp(r.left+r.width/2-w/2,8,vw-w-8); y=r.bottom+gap; if(y+h>vh-8) y=r.top-gap-h; }
  }
  y=clamp(y,8,Math.max(8,vh-h-8));
  tip.style.setProperty('--tipx',Math.round(x)+'px'); tip.style.setProperty('--tipy',Math.round(y)+'px');
}
function hideTip(){ tip.hidden=true; if(tipAnchor&&tipAnchor.removeAttribute) tipAnchor.removeAttribute('aria-describedby'); tipAnchor=null; }

/* ---------- 动态开关与升段演出（本周有升段或升级时播一次；关动态时不播） ---------- */
function setMotion(m){
  state.motion=m; explicitMotion=true; applyRoot(); save('motion',m);
  if(m==='off'){ root.classList.remove('intro'); finishCount(); stopShow(); }
}
var showAnim=null, showTimer=0;
function stopShow(){
  clearTimeout(showTimer);
  if(showAnim){ try{ showAnim.cancel(); }catch(_){ } showAnim=null; }
  $('#show').style.visibility='hidden';
  $$('.plate.flash').forEach(function(b){ b.classList.remove('flash'); });
}
function playShow(){
  var ups=(BODY.rank_ups||[]).map(dimById).filter(Boolean), slab=$('#show-band');
  if(state.motion!=='on'||(!ups.length&&!BODY.level_up)||!slab.animate) return;
  $('#show-k').textContent=ups.length?'RANK UP!':'LEVEL UP!';
  var sub=ups.map(function(d){ return d.name+' → 「'+titleOf(d,d.rank)+'」'; });
  if(BODY.level_up) sub.push('全身 Lv.'+BODY.level);
  $('#show-s').textContent=sub.join('　');
  $('#show').style.visibility='visible';
  ups.forEach(function(d){ var p=$('.plate[data-dim="'+d.id+'"]'); if(p) p.classList.add('flash'); });
  showAnim=slab.animate([
    {transform:'translateX(-130vw)',easing:'cubic-bezier(.2,.8,.3,1)'},
    {transform:'translateX(0)',offset:0.15},
    {transform:'translateX(0)',offset:0.85,easing:'cubic-bezier(.7,0,.8,.3)'},
    {transform:'translateX(130vw)'}],{duration:2100});
  showAnim.onfinish=stopShow;
  showTimer=setTimeout(stopShow,2600);   /* 不出帧时也按时收尾 */
}
var countTimer=0;
function finishCount(){ clearInterval(countTimer); $$('.num[data-to]').forEach(function(nd){ nd.textContent=nd.getAttribute('data-to'); }); }
function countUp(){
  var nodes=$$('.num[data-to]'); if(!nodes.length) return;
  nodes.forEach(function(nd){ nd.textContent='0'; });
  var start=performance.now()+1000, dur=400;
  clearInterval(countTimer);
  countTimer=setInterval(function(){
    var now=performance.now(); if(now<start) return;
    var p=clamp((now-start)/dur,0,1);
    nodes.forEach(function(nd){ nd.textContent=String(Math.round(Number(nd.getAttribute('data-to'))*p)); });
    if(p>=1) clearInterval(countTimer);
  },1000/12);
}
function intro(){
  if(state.motion!=='on') return;
  root.classList.add('intro'); countUp();
  setTimeout(function(){ root.classList.remove('intro'); },1900);
  setTimeout(playShow,1600);
}
function placeRays(){
  var rays=$('#rays'); if(!rays) return;
  var r=SVG.getBoundingClientRect(), b=document.body.getBoundingClientRect();
  rays.style.setProperty('--rx',Math.round(r.left-b.left+r.width/2)+'px');
  rays.style.setProperty('--ry',Math.round(r.top-b.top+r.height/2)+'px');
}
function onResize(){ clampPlates(); placeRays(); positionTip(); }

/* ---------- 启动 ---------- */
try{
  applyRoot();
  renderStatic();
  renderRadarStatic();
  renderRadar();
  $('#ctl-motion').addEventListener('click',function(ev){ ev.stopPropagation(); setMotion(state.motion==='on'?'off':'on'); });
  document.addEventListener('click',function(){ if(pinned) deactivate(); });
  document.addEventListener('keydown',function(ev){
    if(ev.defaultPrevented||ev.ctrlKey||ev.metaKey||ev.altKey) return;
    var t=ev.target, tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
    var k=ev.key;
    if(k==='m'||k==='M') setMotion(state.motion==='on'?'off':'on');
    else if(k==='Escape') deactivate();
  });
  window.addEventListener('scroll',positionTip,{passive:true});
  window.addEventListener('resize',onResize);
  if(window.ResizeObserver) new ResizeObserver(function(){ clampPlates(); placeRays(); }).observe($('#radar'));
  var onReduce=function(){ if(!explicitMotion){ state.motion=reduce.matches?'off':'on'; applyRoot(); if(state.motion==='off') stopShow(); } };
  if(reduce.addEventListener) reduce.addEventListener('change',onReduce); else if(reduce.addListener) reduce.addListener(onReduce);
  document.addEventListener('visibilitychange',function(){ root.classList.toggle('page-hidden',document.hidden); });
  clampPlates(); placeRays();
  intro();
  requestAnimationFrame(function(){
    clampPlates(); placeRays();
    if(FOCUS&&dimById(FOCUS)) activate(FOCUS,$('.plate[data-dim="'+FOCUS+'"]'),true,'side');
  });
  root.setAttribute('data-ready','1');
}catch(e){ report('初始化失败：'+((e&&e.stack)||e)); }
})();
</script>
</body>
</html>
